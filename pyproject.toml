[project]
name = "hecrig"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.1.2",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    # Built-in Windows OCR, used to scan images and scanned PDFs.
    "winrt-Windows.Media.Ocr>=4.0.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=4.0.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=4.0.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "flet-web>=1.1.2",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.mycompany"
product = "HECRIG"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"
